plugins { id 'com.android.application' }

android {
    namespace 'com.dennis.stemstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dennis.stemstudio'
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName '0.1.6-four-stem-fast'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra' }
        }
    }
    buildTypes {
        debug { debuggable true; applicationIdSuffix '.fast016' }
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
}
