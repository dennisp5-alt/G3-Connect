plugins { id 'com.android.application' }

android {
    namespace 'com.dennis.g3connect'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dennis.g3connect'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.6.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
