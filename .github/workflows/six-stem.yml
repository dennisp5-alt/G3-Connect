name: Dennis Stem Studio v0.1.8 Six Stems
on:
  push:
    branches:
      - experiment/stem-studio-six-stem-v018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch the six-stem model
        run: |
          mkdir -p models
          curl -fLsS --retry 3 "https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx" -o models/htdemucs_6s_fp16weights.onnx
          ls -la models
          sha256sum models/*
      - name: Build the APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018" >/dev/null
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018
          bash scripts/prepare_native.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DennisStemStudio-v0.1.8-SixStem
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DennisStemStudio-v0.1.8-Six-Stem-Model
          path: models/*.onnx
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Run the engine on 60 seconds for time, memory and the sum
        run: |
          V=1.13.8
          curl -fLsS --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-v$V-linux-x64-shared.tar.bz2" -o /tmp/sherpa.tar.bz2
          mkdir -p /tmp/sherpa && tar -xjf /tmp/sherpa.tar.bz2 -C /tmp/sherpa --strip-components=1
          L=$(dirname "$(find /tmp/sherpa -name 'libonnxruntime*.so*' | head -1)")
          g++ -std=c++17 -O3 -Iapp/src/main/cpp -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" experiments/six-stem/bench_six.cpp -o /tmp/bench_six -L"$L" -l:$(basename "$(find "$L" -name 'libonnxruntime*.so*' | head -1)") -Wl,-rpath,"$L" -lpthread
          pip install --disable-pip-version-check numpy scipy
          python experiments/four-stem/bench/make_song.py /tmp/song.wav 70
          mkdir -p /tmp/out
          nproc
          /tmp/bench_six models/htdemucs_6s_fp16weights.onnx /tmp/song.wav /tmp/out s 60 4 | tee six.txt
          python experiments/six-stem/check_sum.py /tmp/song.wav /tmp/out s | tee -a six.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-stem-bench
          path: six.txt
          retention-days: 30
