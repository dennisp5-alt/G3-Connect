name: Studio Quality probe (BS-RoFormer SW against HT-Demucs 6s)

# Measures only: nothing is built for release and no production behaviour changes. The excerpts and the
# BS-RoFormer SW weights are downloaded inside the run and never committed or uploaded; only numbers are kept.
on:
  workflow_dispatch:
  push:
    branches: ['experiment/studio-quality-roformer']
    paths:
      - 'experiments/studio-quality/**'
      - '.github/workflows/studio-quality-probe.yml'

permissions:
  contents: read

env:
  HTDEMUCS_URL: 'https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx'
  EXCERPTS: '12'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tools (PyTorch for the processor, bs-roformer-infer, musdb)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # FFmpeg from BtbN's static builds (no apt: the runner's mirrors can be down), for musdb's stems.
          gh release download latest -R BtbN/FFmpeg-Builds -p 'ffmpeg-master-latest-linux64-gpl.tar.xz' -O /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo /tmp/ffmpeg/bin >> "$GITHUB_PATH"; export PATH=/tmp/ffmpeg/bin:$PATH; ffmpeg -hide_banner -version | head -1
          pip install --disable-pip-version-check -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --disable-pip-version-check -q bs-roformer-infer musdb soundfile scipy pyyaml
          python -c "import torch; print('torch', torch.__version__, 'threads', torch.get_num_threads())"
          nproc; free -g

      - name: BS-RoFormer SW (fetched and hash-checked by bs-roformer-infer)
        run: |
          bs-roformer-download --list-models | head -40 || true
          bs-roformer-download --model roformer-model-bs-roformer-sw-by-jarredou --output-dir models
          ls -la models models/* || true
          sha256sum $(find models -name '*.ckpt') | tee probe.txt
          python experiments/studio-quality/model_facts.py "$(find models -name '*.ckpt' | head -1)" "$(find models -name '*.yaml' | head -1)" | tee -a probe.txt

      - name: Stem Studio's engine (HT-Demucs 6s) for Linux, the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ONNX Runtime for Linux from its NuGet package (the same source as the Windows build), newest stable.
          ORT=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/index.json | python -c "import sys,json; v=[x for x in json.load(sys.stdin)['versions'] if '-' not in x]; print(v[-1])")
          echo "ONNX Runtime $ORT"
          curl -fsSL -o /tmp/ort.zip "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$ORT/microsoft.ml.onnxruntime.$ORT.nupkg"
          mkdir -p /tmp/ort && cd /tmp/ort && unzip -q /tmp/ort.zip && cd - > /dev/null
          L=/tmp/ort/runtimes/linux-x64/native; H=/tmp/ort/build/native/include
          ls "$L" "$H"
          g++ -std=c++17 -O3 -I"$H" desktop/engine/stem_engine.cpp -o /tmp/stemengine -L"$L" -lonnxruntime -Wl,-rpath,"$L" -lpthread
          mkdir -p models && curl -fLsS --retry 3 "$HTDEMUCS_URL" -o models/htdemucs_6s.onnx

      - name: Real-music excerpts with true stems (MUSDB18 7-second test previews)
        run: python experiments/studio-quality/excerpts.py excerpts "$EXCERPTS" | tee -a probe.txt

      - name: Separate with HT-Demucs 6s (Stem Studio's engine, processor)
        run: |
          python experiments/studio-quality/timed.py htdemucs_6s "$EXCERPTS" 'for d in excerpts/*/; do /tmp/stemengine --model models/htdemucs_6s.onnx --in "$d/mix.wav" --out "$d" --prefix ht --device cpu > /dev/null || exit 1; done' | tee -a probe.txt
          python experiments/studio-quality/score.py excerpts htdemucs_6s '{dir}/ht_{stem}_24bit.wav' | tee -a probe.txt

      - name: Separate with BS-RoFormer SW (PyTorch, processor)
        run: |
          mkdir -p sw-in sw-out
          for d in excerpts/*/; do n=$(basename "$d"); cp "$d/mix.wav" "sw-in/$n.wav"; done
          python experiments/studio-quality/timed.py bs_roformer_sw "$EXCERPTS" 'bs-roformer-infer --input_folder sw-in --store_dir sw-out --models_dir models > sw-log.txt 2>&1' | tee -a probe.txt
          tail -5 sw-log.txt
          find sw-out -type f | head -14
          # Put each excerpt's stems beside its references, whatever the tool names them.
          for d in excerpts/*/; do
            n=$(basename "$d")
            for s in vocals drums bass other guitar piano; do
              f=$(find sw-out -type f -iname "*${n}*${s}*.wav" | head -1)
              [ -z "$f" ] && f=$(find "sw-out/$n" -type f -iname "*${s}*.wav" 2>/dev/null | head -1)
              [ -n "$f" ] && cp "$f" "$d/sw_${s}.wav"
            done
          done
          python experiments/studio-quality/score.py excerpts bs_roformer_sw '{dir}/sw_{stem}.wav' | tee -a probe.txt

      - name: Results
        if: always()
        run: cat probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-quality-probe
          path: |
            probe.txt
            score-*.json
            sw-log.txt
          retention-days: 30
