name: Three-Stem KUIELab Source-Model Probe
on:
  push:
    branches: [experiment/stem-studio-three-stem-feasibility]
    paths:
      - '.github/workflows/three-stem-model-probe.yml'
      - 'experiments/three-stem/probe_kuielab_drums.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare minimal ONNX host runtime
        run: python -m pip install --disable-pip-version-check numpy onnxruntime
      - name: Download two genuine drum models
        run: |
          set -euo pipefail
          mkdir -p /tmp/drums
          curl -fLsS --retry 3 --retry-delay 2 \
            "https://huggingface.co/Politrees/UVR_resources/resolve/main/models/MDXNet/kuielab_a_drums.onnx?download=true" \
            -o /tmp/drums/kuielab_a_drums.onnx
          curl -fLsS --retry 3 --retry-delay 2 \
            "https://huggingface.co/Politrees/UVR_resources/resolve/main/models/MDXNet/kuielab_b_drums.onnx?download=true" \
            -o /tmp/drums/kuielab_b_drums.onnx
          echo "40f586b7091934dd6f5563f0cba8f14bad57ce88440da1098bf388ea716c2901  /tmp/drums/kuielab_a_drums.onnx" | sha256sum --check
          echo "a6fecee758059b33ed99f6dabba297439b3e7cacfac4b1097bd324aff8052208  /tmp/drums/kuielab_b_drums.onnx" | sha256sum --check
      - name: Probe KUIELab A drum tensors and host inference
        run: python experiments/three-stem/probe_kuielab_drums.py --model /tmp/drums/kuielab_a_drums.onnx --threads 2 --report reports/kuielab_a_drums_host.json
      - name: Probe KUIELab B drum tensors and host inference
        if: always()
        run: python experiments/three-stem/probe_kuielab_drums.py --model /tmp/drums/kuielab_b_drums.onnx --threads 2 --report reports/kuielab_b_drums_host.json
      - name: Save source-model feasibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DennisStemStudio-3stem-KUIELab-Host-Probe
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
