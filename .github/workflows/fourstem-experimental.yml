name: Dennis Stem Studio Four-Stem Experiment
on:
  push:
    branches:
      - experiment/stem-studio-four-stem-v012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Prepare sherpa-onnx and ONNX Runtime C API
        run: bash scripts/prepare_native.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build four-stem experimental debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DennisStemStudio-v0.1.2-FourStem-EXPERIMENTAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 15
