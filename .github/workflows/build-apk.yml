name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and install Android SDK platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          if [ -z "$SDKM" ]; then echo "sdkmanager not available"; exit 1; fi
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: G3-Connect-v0.1.1-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk G3Connect-v0.1.1.apk
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 G3Connect-v0.1.1.apk --clobber
          else
            gh release create v0.1.1 G3Connect-v0.1.1.apk --target "$GITHUB_SHA" \
              --title "G3 Connect v0.1.1 - Bluetooth diagnostic" \
              --notes "Read-only BLE diagnostics. Scooter authentication and settings are not implemented."
          fi
