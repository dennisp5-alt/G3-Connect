name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and install Android SDK platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          if [ -z "$SDKM" ]; then echo "sdkmanager not available"; exit 1; fi
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Regression test Gen2 and Gen3 encrypted PRE_COMM
        run: |
          mkdir -p "$RUNNER_TEMP/g3-test"
          javac -d "$RUNNER_TEMP/g3-test" app/src/main/java/com/dennis/g3connect/NinebotProbe.java tools/CryptoSmokeTest.java
          java -cp "$RUNNER_TEMP/g3-test" com.dennis.g3connect.CryptoSmokeTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: G3-Connect-v0.6.2-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk G3Connect-v0.6.2.apk
          if gh release view v0.6.2 >/dev/null 2>&1; then
            gh release upload v0.6.2 G3Connect-v0.6.2.apk --clobber
          else
            gh release create v0.6.2 G3Connect-v0.6.2.apk --target "$GITHUB_SHA" \
              --title "G3 Connect v0.6.2 - Alternate authentication handshake diagnostic" \
              --notes "Separate one-shot zero-payload AUTH test from working 14-byte AUTH; no pairing writes, firmware changes, or saved keys. All v0.6.1 settings retained."
          fi
